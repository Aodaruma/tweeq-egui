name: Deploy Rust gallery and API docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build WASM gallery
        working-directory: crates/tweeq-demo
        run: trunk build index.html --release --locked --public-url /tweeq-egui/ --dist ../../site
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p tweeq-core -p tweeq-egui --all-features --no-deps --locked
      - name: Add API documentation to the site
        run: |
          mkdir -p site/api
          cp -R target/doc/. site/api/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
