[workspace]
members = [
    "crates/tweeq-core",
    "crates/tweeq-egui",
    "crates/tweeq-demo",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Aodaruma/tweeq-egui"
homepage = "https://aodaruma.github.io/tweeq-egui/"

[workspace.dependencies]
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
tweeq-core = { path = "crates/tweeq-core", version = "=0.1.0-alpha.1" }
tweeq-egui = { path = "crates/tweeq-egui", version = "=0.1.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
